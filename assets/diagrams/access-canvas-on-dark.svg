<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="590" viewBox="0 0 1040 590" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Access Canvas · Free-form drag-and-drop board, policy hubs, and live reachability advisor</title>
<desc id="d">Client identity groups (#employees, #sales, #ssh-users) connect through Dial policy hubs to zero-trust service groups (#crm-https, #devbox-ssh), which connect through Bind policy hubs to hosting identities (#crm-https-hosts, #devbox-hosts) and Edge Router policies underneath. A floating right drawer diagnoses why an identity can or cannot reach a service and previews staged REST API calls.</desc>
