<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Plug-compatible architecture with OpenZiti Controller and ZAC binding</title>
<desc id="d">Baked Pasta Console builds a drop-in static SPA bundle (ziti-console.zip) served directly by an OpenZiti Controller zac binding or any static web server, communicating with the OpenZiti Edge Management API (/edge/management/v1) and OIDC PKCE (/oidc).</desc>
<defs>
<marker id="arr-http" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3E5A54"/></marker>
<marker id="arr-overlay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D9481C"/></marker>
<marker id="arr-router" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A7B62"/></marker>
</defs>
<rect width="1040" height="420" rx="14" fill="#FFFDF9"/>
<text x="32" y="40" font-size="19" font-weight="700" fill="#14302B" text-anchor="start">Plug-Compatible Architecture · OpenZiti Controller &amp; ZAC Binding</text>
<text x="32" y="61" font-size="12.5" font-weight="400" fill="#5E6E69" text-anchor="start">Drop-in static SPA bundle (ziti-console.zip) speaking standard OpenZiti Edge Management REST &amp; OIDC PKCE.</text>
<rect x="24" y="84" width="330" height="312" rx="14" fill="#F6ECDC" stroke="#E3D3B8" stroke-width="1.5"/>
