<text x="60" y="243" font-size="12.5" font-weight="400" fill="#5E6E69" text-anchor="start">Full Edge Management CRUD</text>
<text x="60" y="261" font-size="12.5" font-weight="400" fill="#5E6E69" text-anchor="start">Interactive Demo Sandbox</text>
<text x="60" y="279" font-size="12.5" font-weight="400" fill="#5E6E69" text-anchor="start"></text>
