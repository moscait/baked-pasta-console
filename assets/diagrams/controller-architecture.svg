<text x="60" y="150" font-size="15" font-weight="650" fill="#14302B" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">baked-pasta-console</text>
<text x="60" y="171" font-size="12.5" font-weight="400" fill="#5E6E69" text-anchor="start">React 19 + TypeScript + Vite</text>
<text x="60" y="189" font-size="12.5" font-weight="400" fill="#5E6E69" text-anchor="start">Access Canvas (Board &amp; Flow)</text>
