# Production profile (used by the container image)
vaadin.launch-browser=false

# No default controller in the container: ZITI_CONTROLLERS must be set, or the application will not start.
# The console has no login of its own, so it only ever talks to the controllers listed there.
ziti.controllers=${ZITI_CONTROLLERS:}

# Session cookie only over HTTPS. Browsers treat http://localhost as secure, so local runs still work;
# set SESSION_COOKIE_SECURE=false only for plain-HTTP access from another host (not recommended).
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# Behind a reverse proxy, trust X-Forwarded-* only from proxies on private/loopback addresses
# (Tomcat's default internal-proxies list), not from any client that sends the headers.
server.forward-headers-strategy=native
