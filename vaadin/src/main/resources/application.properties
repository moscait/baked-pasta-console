server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# Default OpenZiti Edge Controller. On a session's first visit it is probed; if it does not
# answer, the console opens the Demo Sandbox instead of the sign-in page.
ziti.controller-url=${ZITI_CONTROLLER_URL:https://localhost:1280}
# Accept self-signed controller certificates (off by default; the user can change it on sign-in).
# Trust-all also skips hostname checks, like curl -k.
ziti.trust-all-certificates=${ZITI_TRUST_ALL:false}

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.example
