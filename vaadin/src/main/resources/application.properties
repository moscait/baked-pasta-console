server.port=${PORT:8080}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# REQUIRED: the OpenZiti Edge Controllers this console may use, separated by commas (scheme://host[:port]).
# Users choose from this list and the server never contacts any other host, so a visitor cannot use the
# console to reach arbitrary addresses on this server's network. The first entry is the default; on a
# session's first visit it is probed, and if it does not answer the console opens the Demo Sandbox.
# The application refuses to start without at least one valid entry. (Local default for ./mvnw only.)
ziti.controllers=${ZITI_CONTROLLERS:https://localhost:1280}
# Trust the controllers' own CA instead of turning certificate checks off: a PEM bundle such as the
# output of `curl -k https://<controller>/.well-known/est/cacerts | base64 -d | openssl pkcs7 -inform DER -print_certs`
# (concatenate several for several controllers). Chain and hostname checks still apply.
# Empty = the JVM's default trust store.
ziti.controller-ca-file=${ZITI_CONTROLLER_CA_FILE:}
# Accept any controller certificate and skip hostname checks, like curl -k (off by default). Server-side
# only: users cannot change it.
ziti.trust-all-certificates=${ZITI_TRUST_ALL:false}

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,io.moscait.bpc
