version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch routine minor/patch updates into one PR.
      minor-and-patch:
        update-types: [minor, patch]
      # All majors in one PR too, so plugins that must move together (e.g. eslint and
      # eslint-plugin-react-hooks) are tested together. Review it before merging: majors can
      # need code changes, and `npm run check` in CI is the gate.
      majors:
        update-types: [major]
    ignore:
      # TypeScript 7 is outside typescript-eslint 8's peer range (<6.1), so npm cannot install
      # it and the whole majors group fails. Remove once typescript-eslint supports it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
