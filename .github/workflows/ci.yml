name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by release-vaadin.yml, so a release runs exactly the checks a PR does.
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Web (React / Vite)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npx vite build

  vaadin:
    name: Vaadin (Java / Spring Boot)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vaadin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw test -B
      # Build the container too, so a Dockerfile that only works on a developer's machine (e.g. copying
      # a gitignored file) fails here instead of in the release workflow.
      - run: docker build -t baked-pasta-console-vaadin:ci .
